<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRDT Notes</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────── -->
<header class="app-header">
  <a class="hub-link" href="../">← Hub</a>
  <span class="sep">·</span>
  <h1>CRDT Notes</h1>
  <div class="header-actions">
    <button id="btn-reset" class="btn btn-ghost btn-sm">⟳ Reset seed</button>
  </div>
</header>

<!-- ── TOOLBAR ──────────────────────────────────────────────────────── -->
<div class="toolbar">
  <span style="font-size:12px;color:var(--ink-muted);font-weight:500;">
    Two simulated peers · local-only · hash route <code style="font-size:11px;">#/n/&lt;id&gt;</code>
  </span>
</div>

<!-- ── WORKSPACE ────────────────────────────────────────────────────── -->
<div class="workspace">

  <!-- ══ PEER A ══════════════════════════════════════════════════════ -->
  <div class="peer-pane" id="peer-A">
    <!-- Peer header -->
    <div class="peer-header">
      <span class="peer-label">Peer A</span>
      <span class="peer-status" id="status-A">Online</span>
      <span class="queue-badge" id="queue-badge-A">0 queued</span>
      <button class="btn btn-ghost btn-sm peer-toggle" id="toggle-A">Go Offline</button>
    </div>

    <!-- Conflict cards -->
    <div class="conflict-zone" id="conflict-zone-A"></div>

    <!-- Peer body: note list + editor -->
    <div class="peer-pane-body">
      <!-- Note list -->
      <div class="note-list-panel">
        <div class="note-list-header">
          <span>Notes</span>
          <button id="new-note-A" class="btn btn-primary btn-sm" style="margin-left:auto;">+ New</button>
        </div>
        <div class="note-list" id="note-list-A"></div>
      </div>

      <!-- Editor -->
      <div class="editor-panel">
        <div class="editor-empty" id="editor-empty-A">
          Select or create a note
        </div>
        <div id="editor-main-A" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
          <div class="editor-title-wrap">
            <input
              type="text"
              class="editor-title"
              id="editor-title-A"
              placeholder="Note title…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <textarea
            class="editor-body"
            id="editor-body-A"
            placeholder="Start writing…"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Snapshot bar -->
    <div class="snapshot-zone">
      <span class="snapshot-info" id="snapshot-info-A">No snapshot</span>
      <button id="snap-save-A" class="btn btn-ghost btn-sm">💾 Save snapshot</button>
      <button id="snap-restore-A" class="btn btn-ghost btn-sm">↩ Restore</button>
    </div>
  </div><!-- /peer-A -->

  <!-- ══ PEER B ══════════════════════════════════════════════════════ -->
  <div class="peer-pane" id="peer-B">
    <!-- Peer header -->
    <div class="peer-header">
      <span class="peer-label">Peer B</span>
      <span class="peer-status" id="status-B">Online</span>
      <span class="queue-badge" id="queue-badge-B">0 queued</span>
      <button class="btn btn-ghost btn-sm peer-toggle" id="toggle-B">Go Offline</button>
    </div>

    <!-- Conflict cards -->
    <div class="conflict-zone" id="conflict-zone-B"></div>

    <!-- Peer body: note list + editor -->
    <div class="peer-pane-body">
      <!-- Note list -->
      <div class="note-list-panel">
        <div class="note-list-header">
          <span>Notes</span>
          <button id="new-note-B" class="btn btn-primary btn-sm" style="margin-left:auto;">+ New</button>
        </div>
        <div class="note-list" id="note-list-B"></div>
      </div>

      <!-- Editor -->
      <div class="editor-panel">
        <div class="editor-empty" id="editor-empty-B">
          Select or create a note
        </div>
        <div id="editor-main-B" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
          <div class="editor-title-wrap">
            <input
              type="text"
              class="editor-title"
              id="editor-title-B"
              placeholder="Note title…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <textarea
            class="editor-body"
            id="editor-body-B"
            placeholder="Start writing…"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Snapshot bar -->
    <div class="snapshot-zone">
      <span class="snapshot-info" id="snapshot-info-B">No snapshot</span>
      <button id="snap-save-B" class="btn btn-ghost btn-sm">💾 Save snapshot</button>
      <button id="snap-restore-B" class="btn btn-ghost btn-sm">↩ Restore</button>
    </div>
  </div><!-- /peer-B -->

</div><!-- /workspace -->

<script type="module" src="js/app.js"></script>
</body>
</html>
