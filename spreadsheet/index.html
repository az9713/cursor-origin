<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spreadsheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Spreadsheet</h1>
    <button type="button" id="undo">Undo</button>
    <button type="button" id="redo" class="ghost">Redo</button>
    <button type="button" id="export" class="ghost">Export CSV</button>
    <button type="button" id="import-btn" class="ghost">Import CSV</button>
    <input id="import" type="file" accept=".csv,text/csv">
    <a href="../">Hub</a>
  </header>
  <div class="bar">
    <div class="addr" id="addr">A1</div>
    <input id="formula" aria-label="Formula bar" spellcheck="false">
  </div>
  <div class="sheet-wrap" style="position:relative">
    <table class="sheet" id="sheet"></table>
    <div id="fill" class="fill" hidden></div>
  </div>
  <div class="status" id="status"></div>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
