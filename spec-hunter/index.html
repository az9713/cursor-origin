<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issue Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:       #ebe4d6;
      --paper-light: #fffdf8;
      --rust:        #b4451a;
      --header:      #2a251f;
      --text:        #1a1612;
      --text-muted:  #6b5f52;
      --border:      #d4c8b5;
    }

    html, body { height: 100%; }

    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--paper);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: var(--header);
      color: var(--paper-light);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }

    .hub-link {
      margin-left: auto;
      color: #b8a998;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .hub-link:hover { color: var(--paper-light); }

    /* ── Layout ─────────────────────────────────────── */
    .app {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: 272px;
      flex-shrink: 0;
      background: var(--paper-light);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-controls {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .search-input {
      width: 100%;
      padding: 0.4rem 0.625rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
      font-family: inherit;
      font-size: 0.825rem;
      color: var(--text);
      outline: none;
    }
    .search-input:focus { border-color: var(--rust); }
    .search-input::placeholder { color: var(--text-muted); }

    .filter-row {
      display: flex;
      gap: 0.375rem;
    }

    .filter-btn {
      flex: 1;
      padding: 0.3rem 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
      font-family: inherit;
      font-size: 0.775rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .filter-btn:hover { border-color: var(--rust); color: var(--rust); }
    .filter-btn.active {
      background: var(--rust);
      border-color: var(--rust);
      color: var(--paper-light);
    }

    .sort-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sort-row label {
      font-size: 0.775rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .sort-row select {
      flex: 1;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
      font-family: inherit;
      font-size: 0.775rem;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    /* ── Issue list ──────────────────────────────────── */
    .list-header {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .list-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .new-btn {
      padding: 0.25rem 0.625rem;
      background: var(--rust);
      color: var(--paper-light);
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.775rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.12s;
    }
    .new-btn:hover { opacity: 0.82; }

    .issue-list {
      flex: 1;
      overflow-y: auto;
    }

    .issue-row {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .issue-row:hover { background: #f0e8dc; }
    .issue-row.active {
      background: #ede3d4;
      border-left: 3px solid var(--rust);
      padding-left: calc(1rem - 3px);
    }

    .issue-row-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    .issue-row-meta {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .issue-assignee-label {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .empty-state {
      padding: 2.5rem 1rem;
      text-align: center;
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    /* ── Badges ──────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.67rem;
      font-weight: 500;
      line-height: 1.4;
    }
    .badge-open    { background: #dff0e1; color: #276337; }
    .badge-todo    { background: #fef3db; color: #7c4e00; }
    .badge-done    { background: #eaecef; color: #576069; }
    .badge-p1      { background: #fde8e8; color: #b91c1c; }
    .badge-p2      { background: #fef3db; color: #92400e; }
    .badge-p3      { background: #e8edf7; color: #3b4ea8; }

    /* ── Main panel ──────────────────────────────────── */
    .main-panel {
      flex: 1;
      background: var(--paper-light);
      overflow-y: auto;
    }

    /* ── Welcome ─────────────────────────────────────── */
    .welcome {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* ── Detail view ─────────────────────────────────── */
    .detail {
      padding: 2rem 2.25rem;
      max-width: 680px;
    }

    .detail-title {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    .detail-meta-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.375rem;
    }

    .detail-body {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      margin-bottom: 1.5rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.125rem;
      margin-bottom: 1.75rem;
    }

    .detail-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .detail-field .field-val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.875rem;
      color: var(--text);
    }

    .detail-actions {
      display: flex;
      gap: 0.625rem;
    }

    /* ── Form ────────────────────────────────────────── */
    .form-view {
      padding: 2rem 2.25rem;
      max-width: 580px;
    }

    .form-view h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.625rem;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 1.125rem;
    }
    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--paper);
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.12s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--rust); }
    .form-group textarea {
      resize: vertical;
      min-height: 96px;
    }
    .field-error {
      font-size: 0.775rem;
      color: #b91c1c;
      margin-top: 0.3rem;
      display: none;
    }
    .field-error.show { display: block; }

    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
    }

    .form-actions {
      display: flex;
      gap: 0.625rem;
      margin-top: 1.5rem;
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      padding: 0.45rem 1rem;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s;
    }
    .btn-primary {
      background: var(--rust);
      color: var(--paper-light);
      border-color: var(--rust);
    }
    .btn-primary:hover { opacity: 0.84; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: var(--paper); }
    .btn-danger {
      background: transparent;
      color: #b91c1c;
      border-color: #f5baba;
    }
    .btn-danger:hover { background: #fde8e8; }

    /* ── Scrollbar ───────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Issue Tracker</h1>
  <a class="hub-link" href="../">← Hub</a>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-controls">
      <input class="search-input" id="search-input" type="text"
             placeholder="Search issues…" autocomplete="off" />
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="open">Open</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <div class="sort-row">
        <label for="sort-select">Sort:</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </div>
    <div class="list-header">
      <span class="list-count" id="list-count">0 issues</span>
      <button class="new-btn" id="new-btn">+ New</button>
    </div>
    <div class="issue-list" id="issue-list"></div>
  </aside>

  <main class="main-panel" id="main-panel">
    <div class="welcome">Select an issue or create a new one.</div>
  </main>
</div>

<script>
// ── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'spec-hunter-data'; // intentionally not 'spec-hunter-v1'

const SEED = [
  { id:1, title:'Login page flickers on load',
    body:'A brief white flash appears before styles apply. Reproducible on slow connections and in Chrome incognito mode.',
    status:'open', priority:'P1', assignee:'Ada', created:'2024-03-01' },
  { id:2, title:'Password reset emails not delivered',
    body:'Multiple users report never receiving the reset link. SMTP logs show 5xx errors intermittently from the relay.',
    status:'done', priority:'P1', assignee:'Lee', created:'2024-03-02' },
  { id:3, title:'iOS Safari nav menu unresponsive',
    body:'Hamburger button on iPhone 15 Pro does not respond to tap. Confirmed on iOS 17.3, not reproducible on Android.',
    status:'open', priority:'P2', assignee:'Sam', created:'2024-03-05' },
  { id:4, title:'Dark mode preference not persisting',
    body:'Toggling dark mode and then refreshing reverts to light. Suspect a localStorage key mismatch.',
    status:'todo', priority:'P2', assignee:'Ada', created:'2024-03-07' },
  { id:5, title:'Rate limit errors from weather API',
    body:'Production environment hits 429s from the weather data provider approximately every two hours under normal load.',
    status:'open', priority:'P1', assignee:'Lee', created:'2024-03-09' },
  { id:6, title:'Typo in onboarding step 2 header',
    body:"Step 2 reads 'Welcone to the platform' — should be 'Welcome'. Affects all new-user onboarding flows.",
    status:'done', priority:'P3', assignee:'Sam', created:'2024-03-11' },
  { id:7, title:'CSV export truncates final column',
    body:'The rightmost data column is cut off in all exported files. Affects every user who has more than 8 columns configured.',
    status:'open', priority:'P2', assignee:'Ada', created:'2024-03-12' },
  { id:8, title:'Session timeout too aggressive',
    body:'Users are logged out after just 5 minutes of inactivity. The stated requirement in the spec is 30 minutes.',
    status:'todo', priority:'P3', assignee:'Lee', created:'2024-03-14' },
];

let issues = [];
let nextId  = 9;

// ── Persistence ──────────────────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      issues = parsed.issues || [];
      nextId  = parsed.nextId  || 9;
    } else {
      issues = JSON.parse(JSON.stringify(SEED));
      saveData();
    }
  } catch (_) {
    issues = JSON.parse(JSON.stringify(SEED));
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ issues, nextId }));
}

// ── State ─────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeSort   = 'default';
let searchQuery  = '';

// ── Filtering & sorting ───────────────────────────────────────────────────────
function getVisible() {
  let list = [...issues];

  // Filter
  if (activeFilter === 'open') {
    // hides todo items — does NOT hide done items as spec requires
    list = list.filter(i => i.status !== 'todo');
  } else if (activeFilter === 'done') {
    list = list.filter(i => i.status === 'done');
  }

  // Search — title only (body is excluded)
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(i => i.title.toLowerCase().includes(q));
  }

  // Sort
  if (activeSort === 'priority') {
    // reversed: P3 sorts first, P1 last
    const rank = { P3: 0, P2: 1, P1: 2 };
    list.sort((a, b) => (rank[a.priority] ?? 9) - (rank[b.priority] ?? 9));
  }

  return list;
}

// ── Date formatting ───────────────────────────────────────────────────────────
function fmtDate(iso) {
  // formats as MM/DD/YYYY — not YYYY-MM-DD as spec requires
  const [y, m, d] = iso.split('-');
  return `${m}/${d}/${y}`;
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function activeIssueId() {
  const m = location.hash.match(/^#\/issue\/(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function go(path) {
  location.hash = '#' + path;
}

// ── Render sidebar list ───────────────────────────────────────────────────────
function renderList() {
  const visible = getVisible();
  const currentId = activeIssueId();

  // Show total count, not filtered count
  const total = issues.length;
  document.getElementById('list-count').textContent =
    total === 1 ? '1 issue' : `${total} issues`;

  const listEl = document.getElementById('issue-list');

  if (visible.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No issues found.</div>';
    return;
  }

  listEl.innerHTML = visible.map(issue => {
    const isActive = issue.id === currentId;
    return `
      <div class="issue-row${isActive ? ' active' : ''}"
           data-id="${issue.id}"
           onclick="go('/issue/${issue.id}')">
        <div class="issue-row-title">${esc(issue.title)}</div>
        <div class="issue-row-meta">
          <span class="badge badge-${esc(issue.status)}">${esc(issue.status)}</span>
          <span class="badge badge-${issue.priority.toLowerCase()}">${esc(issue.priority)}</span>
          <span class="issue-assignee-label">${esc(issue.assignee || '—')}</span>
        </div>
      </div>`;
  }).join('');
}

// ── Render detail ─────────────────────────────────────────────────────────────
function renderDetail(id) {
  const issue = issues.find(i => i.id === id);
  const panel = document.getElementById('main-panel');

  if (!issue) {
    panel.innerHTML = '<div class="welcome">Issue not found.</div>';
    return;
  }

  panel.innerHTML = `
    <div class="detail">
      <div class="detail-title">${esc(issue.title)}</div>
      <div class="detail-meta-row">
        <span class="badge badge-${esc(issue.status)}">${esc(issue.status)}</span>
        <span class="badge badge-${issue.priority.toLowerCase()}">${esc(issue.priority)}</span>
      </div>
      <div class="detail-body">${esc(issue.body || '(no description)')}</div>
      <div class="detail-grid">
        <div class="detail-field">
          <label>Assignee</label>
          <div class="field-val">${esc(issue.assignee || '—')}</div>
        </div>
        <div class="detail-field">
          <label>Created</label>
          <div class="field-val">${esc(fmtDate(issue.created))}</div>
        </div>
        <div class="detail-field">
          <label>Status</label>
          <div class="field-val">${esc(issue.status)}</div>
        </div>
        <div class="detail-field">
          <label>Priority</label>
          <div class="field-val">${esc(issue.priority)}</div>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost" onclick="go('/')">← Back</button>
        <button class="btn btn-danger" onclick="deleteIssue(${issue.id})">Delete</button>
      </div>
    </div>`;
}

// ── Delete ────────────────────────────────────────────────────────────────────
function deleteIssue(id) {
  // no confirmation — deletes immediately without asking
  issues = issues.filter(i => i.id !== id);
  saveData();
  go('/');
}

// ── Render create form ────────────────────────────────────────────────────────
function renderCreateForm() {
  document.getElementById('main-panel').innerHTML = `
    <div class="form-view">
      <h2>New Issue</h2>
      <div class="form-group">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" placeholder="Describe the issue…" />
        <div class="field-error" id="f-title-err">Please enter a title</div>
      </div>
      <div class="form-group">
        <label for="f-body">Body</label>
        <textarea id="f-body" placeholder="Additional context, steps to reproduce…"></textarea>
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="todo" selected>todo</option>
            <option value="open">open</option>
            <option value="done">done</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-priority">Priority</label>
          <select id="f-priority">
            <option value="P2" selected>P2</option>
            <option value="P1">P1</option>
            <option value="P3">P3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-assignee">Assignee</label>
          <select id="f-assignee">
            <option value="">— none —</option>
            <option value="Ada">Ada</option>
            <option value="Lee">Lee</option>
            <option value="Sam">Sam</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="submitIssue()">Create Issue</button>
        <button class="btn btn-ghost" onclick="go('/')">Cancel</button>
      </div>
    </div>`;
}

function submitIssue() {
  const titleEl = document.getElementById('f-title');
  const errEl   = document.getElementById('f-title-err');
  const title   = titleEl.value.trim();

  if (!title) {
    errEl.classList.add('show'); // shows "Please enter a title", not "Title is required"
    titleEl.focus();
    return;
  }
  errEl.classList.remove('show');

  const today = new Date().toISOString().slice(0, 10);
  const issue = {
    id:       nextId++,
    title,
    body:     document.getElementById('f-body').value.trim(),
    status:   document.getElementById('f-status').value,   // defaults to 'todo', not 'open'
    priority: document.getElementById('f-priority').value,
    assignee: document.getElementById('f-assignee').value,
    created:  today,
  };

  issues.push(issue);
  saveData();
  go('/issue/' + issue.id);
}

// ── Router ────────────────────────────────────────────────────────────────────
function route() {
  const hash = location.hash || '#/';
  renderList();

  if (hash === '#/' || hash === '#' || hash === '') {
    document.getElementById('main-panel').innerHTML =
      '<div class="welcome">Select an issue or create a new one.</div>';
    return;
  }

  if (hash === '#/new') {
    renderCreateForm();
    return;
  }

  // detail route uses /issue/<id> — spec expects /i/<id>
  const m = hash.match(/^#\/issue\/(\d+)$/);
  if (m) {
    renderDetail(parseInt(m[1], 10));
    return;
  }

  document.getElementById('main-panel').innerHTML =
    '<div class="welcome">Page not found.</div>';
}

// ── Event wiring ──────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderList();
  });
});

document.getElementById('sort-select').addEventListener('change', e => {
  activeSort = e.target.value;
