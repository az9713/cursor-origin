<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Editor</title>

  <!-- Fonts: IBM Plex Sans + Mono only -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <!-- ── Sidebar ──────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <a href="../" id="hub-link" title="Back to Hub">← Hub</a>
      <span>Block Editor</span>
    </div>
    <div id="page-list"></div>
    <button id="new-page-btn">+ New Page</button>
  </aside>

  <!-- ── Main area ────────────────────────── -->
  <main id="main">
    <div id="page-header">
      <div id="breadcrumb"></div>
      <div id="toolbar">
        <button id="export-btn" title="Export current page as Markdown">Export MD</button>
        <button id="import-btn" title="Import Markdown into current page">Import MD</button>
      </div>
    </div>

    <!-- Editor: page title + blocks -->
    <div id="editor"></div>
  </main>
</div>

<!-- ── Slash menu (portal) ────────────────────── -->
<div id="slash-menu" class="slash-menu hidden" role="listbox" aria-label="Block type menu"></div>

<!-- ── Import overlay ─────────────────────────── -->
<div id="import-overlay">
  <div id="import-dialog" role="dialog" aria-label="Import Markdown">
    <h3>Import Markdown</h3>
    <p>Paste GitHub-flavoured Markdown. This <strong>replaces</strong> the current page's content.</p>
    <textarea id="import-textarea" placeholder="# My Page&#10;&#10;- Item one&#10;- [ ] Todo item"></textarea>
    <div class="import-actions">
      <button class="btn btn-secondary" id="import-cancel">Cancel</button>
      <button class="btn btn-primary"   id="import-confirm">Import</button>
    </div>
  </div>
</div>

<!-- ── Scripts (load order matters) ──────────── -->
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/markdown.js"></script>
<script src="js/blocks.js"></script>
<script src="js/slash.js"></script>
<script src="js/drag.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>

</body>
</html>
