<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oak Compiler Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Oak Compiler</h1>
    <span class="spacer"></span>
    <a href="../">Hub</a>
  </header>

  <main class="layout">
    <section class="panel editor-panel">
      <div class="panel-head">Source</div>
      <div class="editor-wrap">
        <div class="editor-toolbar">
          <button type="button" id="run" class="btn primary">Run</button>
          <button type="button" id="step" class="btn">Step</button>
          <button type="button" id="reset" class="btn">Reset sample</button>
        </div>
        <div class="editor-area">
          <pre id="highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea id="source" spellcheck="false" aria-label="Oak source code"></textarea>
        </div>
        <div id="error-bar" class="error-bar" role="alert"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">Output</div>
      <div class="panel-body">
        <pre id="output"></pre>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">Tokens</div>
      <div class="panel-body">
        <ul id="tokens" class="token-list"></ul>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">Bytecode</div>
      <div class="panel-body" id="bytecode"></div>
    </section>

    <section class="panel" style="grid-column: 1 / -1;">
      <div class="panel-head">AST</div>
      <div class="panel-body">
        <pre id="ast" class="json-out"></pre>
      </div>
    </section>
  </main>

  <script src="js/lexer.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/vm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
