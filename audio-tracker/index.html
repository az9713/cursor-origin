<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ─── Header ──────────────────────────────────── -->
<header class="top">
  <h1>Audio Tracker</h1>

  <div class="bpm-group">
    <label for="bpm">BPM</label>
    <input type="number" id="bpm" min="20" max="300" step="1" value="120"
           title="Beats per minute (20–300)">
  </div>

  <button type="button" id="play-btn" class="action">▶ Play</button>
  <button type="button" id="stop-btn" class="action" disabled>■ Stop</button>

  <span class="hdivider"></span>

  <button type="button" id="export-btn" class="ghost" title="Download song as JSON">↑ Export</button>
  <button type="button" id="import-btn" class="ghost" title="Load song from JSON file">↓ Import</button>
  <input  type="file"   id="import-file" accept=".json" hidden>

  <button type="button" id="reset-btn"  class="ghost" title="Reset to seed song">↺ Reset</button>

  <span id="status" class="status-msg"></span>

  <a href="../" title="Back to hub">Hub ↗</a>
</header>

<!-- ─── Main ────────────────────────────────────── -->
<div class="main">

  <!-- Left: tracks + mixer -->
  <aside class="tracks-panel" id="tracks-panel" aria-label="Tracks and mixer"></aside>

  <!-- Right: piano roll -->
  <div class="roll-wrap" aria-label="Piano roll">

    <!-- corner spacer -->
    <div class="pr-corner"></div>

    <!-- ruler (horizontal, synced via JS translateX) -->
    <div class="pr-ruler-clip" aria-hidden="true">
      <div class="pr-ruler" id="pr-ruler"></div>
    </div>

    <!-- piano key labels (vertical, synced via JS translateY) -->
    <div class="pr-keys-clip" aria-hidden="true">
      <div class="pr-keys" id="pr-keys"></div>
    </div>

    <!-- scrollable grid -->
    <div class="pr-grid-outer" id="pr-grid-outer"
         role="application" aria-label="Note grid — click to add or remove notes">
      <div class="pr-grid" id="pr-grid">
        <!-- Black-key row tints, note blocks, and playhead injected by JS -->
        <div class="pr-playhead" id="pr-playhead" aria-hidden="true"></div>
      </div>
    </div>

  </div><!-- .roll-wrap -->

</div><!-- .main -->

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
